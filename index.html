<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liga da Verdade</title>
<style>
  :root {
    --cor-fundo: #0f1115;
    --cor-texto: #e8e8e8;
    --cor-texto-fraco: #9a9a9a;
    --cor-destaque: #c9a227;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--cor-fundo);
    color: var(--cor-texto);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem 1.5rem;
    text-align: center;
  }

  h1 {
    font-size: 1.8rem;
    margin-bottom: 0.5rem;
    color: var(--cor-destaque);
  }

  p {
    color: var(--cor-texto-fraco);
    max-width: 32rem;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <h1>Liga da Verdade</h1>
  <p>Em construção. Esta página vai mostrar, lado a lado, a classificação
  oficial da I Liga e a classificação corrigida do impacto das decisões de
  arbitragem, com base em opiniões publicadas de analistas.</p>
</body>
</html>
