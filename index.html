<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liga da Verdade</title>
<style>
  :root {
    --cor-fundo: #0f1115;
    --cor-texto: #e8e8e8;
    --cor-texto-fraco: #9a9a9a;
    --cor-destaque: #c9a227;
    --cor-linha: #262a33;
    --cor-cabecalho: #1a1d24;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--cor-fundo);
    color: var(--cor-texto);
    min-height: 100vh;
    padding: 1.5rem 1rem 3rem;
  }

  header {
    text-align: center;
    margin-bottom: 1.5rem;
  }

  h1 {
    font-size: 1.8rem;
    margin: 0 0 0.4rem;
    color: var(--cor-destaque);
  }

  .subtitulo {
    color: var(--cor-texto-fraco);
    font-size: 0.95rem;
  }

  h2 {
    font-size: 1.1rem;
    margin: 0 0 0.75rem;
    color: var(--cor-texto);
  }

  .tabela-scroll {
    max-width: 48rem;
    margin: 0 auto 2rem;
    overflow-x: auto;
  }

  table {
    width: 100%;
    min-width: 34rem;
    border-collapse: collapse;
    font-size: 0.9rem;
  }

  th, td {
    padding: 0.5rem 0.6rem;
    text-align: center;
    border-bottom: 1px solid var(--cor-linha);
    white-space: nowrap;
  }

  th {
    background: var(--cor-cabecalho);
    color: var(--cor-texto-fraco);
    font-weight: 600;
    font-size: 0.8rem;
    text-transform: uppercase;
  }

  td.clube, th.clube {
    text-align: left;
    white-space: normal;
  }

  td.pts {
    font-weight: 700;
    color: var(--cor-destaque);
  }

  .aviso, .erro {
    max-width: 32rem;
    margin: 0 auto;
    text-align: center;
    color: var(--cor-texto-fraco);
    line-height: 1.5;
  }

  .erro {
    color: #e08080;
  }

  .nota-verdade {
    max-width: 32rem;
    margin: 0 auto;
    text-align: center;
    color: var(--cor-texto-fraco);
    line-height: 1.5;
    font-size: 0.9rem;
    border-top: 1px solid var(--cor-linha);
    padding-top: 1.5rem;
  }
</style>
</head>
<body>
  <header>
    <h1>Liga da Verdade</h1>
    <p class="subtitulo">Época 2026/27</p>
  </header>

  <h2 style="text-align:center;">Liga real</h2>
  <div id="conteudo" class="tabela-scroll">
    <p class="aviso">A carregar…</p>
  </div>

  <p class="nota-verdade">
    A Liga da Verdade — a classificação corrigida do impacto dos erros de
    arbitragem — chega num próximo entregável. Para já, esta é só a
    classificação oficial.
  </p>

  <script>
    async function carregar() {
      const conteudo = document.getElementById('conteudo');
      let dados;
      try {
        const resposta = await fetch('dados/2026-27.json');
        if (!resposta.ok) throw new Error('HTTP ' + resposta.status);
        dados = await resposta.json();
      } catch (erro) {
        conteudo.innerHTML = '<p class="erro">Não foi possível carregar os dados (' +
          erro.message + '). Se estiveres a abrir este ficheiro diretamente do ' +
          'disco, usa o servidor.bat em vez disso.</p>';
        return;
      }

      const equipas = (dados.classificacao_oficial || []).slice()
        .sort((a, b) => a.posicao - b.posicao);

      if (equipas.length === 0) {
        conteudo.innerHTML = '<p class="aviso">Ainda não há classificação oficial registada.</p>';
        return;
      }

      let html = '<table><thead><tr>' +
        '<th>#</th><th class="clube">Clube</th><th>J</th><th>V</th><th>E</th>' +
        '<th>D</th><th>GM</th><th>GS</th><th>DG</th><th>Pts</th>' +
        '</tr></thead><tbody>';

      for (const eq of equipas) {
        html += '<tr>' +
          '<td>' + eq.posicao + '</td>' +
          '<td class="clube">' + eq.clube + '</td>' +
          '<td>' + eq.pd + '</td>' +
          '<td>' + eq.v + '</td>' +
          '<td>' + eq.e + '</td>' +
          '<td>' + eq.d + '</td>' +
          '<td>' + eq.gm + '</td>' +
          '<td>' + eq.gs + '</td>' +
          '<td>' + eq.dg + '</td>' +
          '<td class="pts">' + eq.pts + '</td>' +
          '</tr>';
      }

      html += '</tbody></table>';
      conteudo.innerHTML = html;
    }

    carregar();
  </script>
</body>
</html>
