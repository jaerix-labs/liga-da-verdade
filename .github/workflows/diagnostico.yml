name: Diagnóstico Highlightly (temporário)

on:
  workflow_dispatch: {}

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Correr diagnóstico
        env:
          HIGHLIGHTLY_KEY: ${{ secrets.HIGHLIGHTLY_KEY }}
        run: python scripts/diagnostico_highlightly.py
